version: "3.9"

services:
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app        # Mount local code
      - /app/node_modules   # Keep container’s node_modules separate
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    command: yarn dev --host 0.0.0.0